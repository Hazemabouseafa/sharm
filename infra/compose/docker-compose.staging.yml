name: sharm-pharaoh-staging

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sharm_pharaoh_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - sharm_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-sharm_pharaoh_staging}"]
      interval: 10s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sharm_pharaoh_staging}
      BOOTSTRAP_CATALOG: ${BOOTSTRAP_CATALOG:-true}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-owner@sharmpharaoh.com}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-owner}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Sharm Pharaoh Owner}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    command: ["sh", "-c", "pnpm db:migrate:deploy && node scripts/coolify-bootstrap.mjs"]
    networks:
      - sharm_internal

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: staging
      DEMO_MODE: ${DEMO_MODE:-false}
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sharm_pharaoh_staging}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      WEB_INTERNAL_URL: http://web:3000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      PREVIEW_SIGNING_SECRET: ${PREVIEW_SIGNING_SECRET:?PREVIEW_SIGNING_SECRET is required}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:?REVALIDATION_SECRET is required}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY is required}
      STORAGE_PUBLIC_DIR: /app/storage/public
      STORAGE_PRIVATE_DIR: /app/storage/private
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-Sharm Pharaoh Travel <reservations@sharmpharaoh.com>}
      PAYMOB_ENABLED: ${PAYMOB_ENABLED:-false}
    volumes:
      - public_staging_storage:/app/storage/public
      - private_staging_storage:/app/storage/private
      - backup_staging_storage:/app/storage/backups
    networks:
      - sharm_internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: staging
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sharm_pharaoh_staging}
      WORKER_CONCURRENCY: 2
      WEB_INTERNAL_URL: http://web:3000
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:?REVALIDATION_SECRET is required}
      STORAGE_PUBLIC_DIR: /app/storage/public
      STORAGE_PRIVATE_DIR: /app/storage/private
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:?BACKUP_ENCRYPTION_PASSPHRASE is required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      EMAIL_FROM: ${EMAIL_FROM:-Sharm Pharaoh Travel <reservations@sharmpharaoh.com>}
    volumes:
      - public_staging_storage:/app/storage/public
      - private_staging_storage:/app/storage/private
      - backup_staging_storage:/app/storage/backups
    networks:
      - sharm_internal

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:4000
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:?REVALIDATION_SECRET is required}
    networks:
      - sharm_internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/robots.txt"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_staging_data:/data
      - caddy_staging_config:/config
    networks:
      - sharm_internal

networks:
  sharm_internal:
    driver: bridge

volumes:
  postgres_staging_data:
  public_staging_storage:
  private_staging_storage:
  backup_staging_storage:
  caddy_staging_data:
  caddy_staging_config:
