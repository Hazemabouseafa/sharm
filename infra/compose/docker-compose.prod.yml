name: sharm-pharaoh-prod

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sharm_pharaoh_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - sharm_internal
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-sharm_pharaoh_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["sh", "-c", "pnpm db:migrate:deploy && pnpm db:seed:prod-init"]
    networks:
      - sharm_internal
    logging: *default-logging

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      INTERNAL_WEB_REVALIDATE_URL: http://web:3000/api/internal/revalidate
      REVALIDATE_SHARED_SECRET: ${REVALIDATE_SHARED_SECRET:?REVALIDATE_SHARED_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      PREVIEW_TOKEN_SECRET: ${PREVIEW_TOKEN_SECRET:?PREVIEW_TOKEN_SECRET is required}
      GUEST_TOKEN_PEPPER: ${GUEST_TOKEN_PEPPER:?GUEST_TOKEN_PEPPER is required}
      STORAGE_PUBLIC_DIR: /app/storage/public
      STORAGE_PRIVATE_DIR: /app/storage/private
      PAYMOB_ENABLED: ${PAYMOB_ENABLED:-false}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_INTEGRATION_ID_CARD: ${PAYMOB_INTEGRATION_ID_CARD:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      TRANSLATE_CONTACT_EMAIL: ${TRANSLATE_CONTACT_EMAIL:-}
    volumes:
      - public_prod_storage:/app/storage/public
      - private_prod_storage:/app/storage/private
      - backup_prod_storage:/app/storage/backups
    networks:
      - sharm_internal
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      WORKER_CONCURRENCY: 2
      INTERNAL_WEB_REVALIDATE_URL: http://web:3000/api/internal/revalidate
      REVALIDATE_SHARED_SECRET: ${REVALIDATE_SHARED_SECRET:?REVALIDATE_SHARED_SECRET is required}
      STORAGE_PUBLIC_DIR: /app/storage/public
      STORAGE_PRIVATE_DIR: /app/storage/private
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:?BACKUP_ENCRYPTION_PASSPHRASE is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      TRANSLATE_CONTACT_EMAIL: ${TRANSLATE_CONTACT_EMAIL:-}
    volumes:
      - public_prod_storage:/app/storage/public
      - private_prod_storage:/app/storage/private
      - backup_prod_storage:/app/storage/backups
    networks:
      - sharm_internal
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    logging: *default-logging

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      INTERNAL_API_URL: http://api:4000/api/v1
      REVALIDATE_SHARED_SECRET: ${REVALIDATE_SHARED_SECRET:?REVALIDATE_SHARED_SECRET is required}
    networks:
      - sharm_internal
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/robots.txt"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_prod_data:/data
      - caddy_prod_config:/config
    networks:
      - sharm_internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging: *default-logging

networks:
  sharm_internal:
    driver: bridge

volumes:
  postgres_prod_data:
  public_prod_storage:
  private_prod_storage:
  backup_prod_storage:
  caddy_prod_data:
  caddy_prod_config:
